  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

; Silkscreen battery sleep/wake log: the release image plus the log, as its own env
; (docs/silkscreen/BATTERY-LOG.md). One CSV row per sleep/wake cycle in
; /silkscreen-battery/battery.csv on the card: two ADC bursts on the battery
; divider, the early re-sleeps, the session's light, radio and clock time. All of it
; sits behind -DSILKSCREEN_BATLOG=1, which only this env sets, so every other env
; builds the code it always did; there is no setting and no screen: flash this env to
; log, flash silkscreen-gh_release to stop. The flags are the release env's, with no
; serial wait and the same log level, so boot timing and the ghost-wake path match
; the release image. The board tag is "silkscreen" like the release image's, so the
; two swap over OTA and from SD. The version carries "-batlog"; the "# fw" line in
; the CSV tells the builds apart. A build with the macro on another device, or in
; silkscreen-test, stops at an #error.
;   pio run -e silkscreen-batlog -t upload
[env:silkscreen-batlog]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  ${silkscreen.device_flags}
  -DSILKSCREEN_BATLOG=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-batlog\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Same log level as the release build

; Silkscreen hardware test firmware (docs/silkscreen/TEST-SUITE.md): boots into
; a menu of bring-up tests. It cannot open a book: the reader, library, home,
; file browser, image viewer, OPDS browser, the plugin catalog with its event
; and HTTP helpers, the reader's sleep screen and the web server are left out of
; the build below, so a live reference to any of them fails the link, and the
; rest of the reader (Settings, OTA, SD firmware update) is unreachable and
; dropped by --gc-sections. lib/Epub and lib/LibraryIndex are still linked
; (shared headers pull them in): no function of theirs stays, but four static
; initialisers do, with the hyphenation tables they reference
; (scripts/check_test_firmware.sh checks the image and allows only those). It
; never writes /.crosspoint/. Its board tag is "silkscreen-test", so neither
; image accepts the other over OTA or from SD: switch over USB. Same sleep path
; as the reader less its plugin-event delivery, and no USB-serial wait, so wake
; timing matches a release build. The front light follows
; [silkscreen] frontlight_flags.
;   pio run -e silkscreen-test -t upload
[env:silkscreen-test]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  ${silkscreen.device_flags}
  -DCROSSPOINT_TEST_SUITE=1
  -DFREEINK_DIAGNOSTICS=1
  -DOMIT_FONTS=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-silkscreen-test\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
custom_i18n_builtin_langs = en
build_src_filter =
  +<*>
  -<activities/reader/>
  -<activities/library/>
  -<activities/browser/>
  -<activities/CatalogActivity.cpp>
  -<activities/plugins/>
  -<components/CatalogScreens.cpp>
  -<util/PluginEvents.cpp>
  -<util/PluginHttp.cpp>
  -<util/PluginLocations.cpp>
  -<activities/home/HomeActivity.cpp>
  -<activities/home/FileBrowserActivity.cpp>
  -<activities/boot_sleep/SleepActivity.cpp>
  -<activities/util/BmpViewerActivity.cpp>
  -<network/CrossPointWebServer.cpp>
  -<network/WebDAVHandler.cpp>

; --- Silkscreen with the Xteink X3's 3.68" panel (792x528), no touch -------------
; The "x3 build": the Silkscreen board cut at its cut line, the X3's UC8253 / UC8279d panel on
; J2, no touch tail. The same device as [silkscreen] for everything but the panel
; (FREEINK_DEVICE_SILKSCREEN, Board::Silkscreen), so the key ladders, the power policy, the
; front light, the battery log and its 5% display step are the 4.26" board's. What it adds:
;   -DSILKSCREEN_PANEL_368=1  the SDK's SILKSCREEN_368 profile: the X3 drivers, no SSD1677,
;                             the X3's stock VER probe, the same pins as [silkscreen];
;   -DFREEINK_CAP_TOUCH=0     no touch at all. It is the variant's default in the SDK, which
;                             asserts it; it is written out here so the intent is in the env.
; ${silkscreen.touch_flags} is not inherited (a GT911 alternate-jumper build has no meaning
; without a touch tail), and the SDK refuses -DSILKSCREEN_DISPLAY_CONTROLLER=ssd1677 here. The
; board tag is silkscreen-368 (silkscreen-368-test), so OTA and the SD update refuse a 4.26"
; image. docs/silkscreen/MODULARITY.md and PORTING.md ("Not a merge: the 3.68" variant").
; The controller is read at every cold boot with the X3's own protocol (VER byte 2: 0x66 is a
; UC8279d, 0xFF a UC8253) and kept across deep sleep in RTC memory. A unit whose VER reads
; blank is taken for a UC8253; force it in platformio.local.ini (skips the probe; it reaches
; every silkscreen-368 env, the test firmware included):
;   [silkscreen368]
;   display_flags = -DSILKSCREEN_DISPLAY_CONTROLLER=uc8279   ; or uc8253
;   pio run -e silkscreen-368 -t upload
[silkscreen368]
; The front light follows [silkscreen] frontlight_flags, so one local override drops it from
; every Silkscreen build; set it here to drop it from this one alone.
frontlight_flags =
  ${silkscreen.frontlight_flags}
display_flags =
; The test firmware has no USB-serial wait, as silkscreen-test has none: its wake timing is a release
; build's, which P5's ghost-wake check judges. A bench that wants the boot lines (the [XTDET] probe line)
; over USB sets it here, for silkscreen-368-test alone, and every boot, ghost wakes included, then takes
; 250 ms longer (P1 logs its panel row, VER bytes and all, each time it opens, so the line is also there
; with a monitor attached afterwards):
;   [silkscreen368]
;   test_serial_flags = -DCROSSPOINT_WAIT_FOR_USB_SERIAL
test_serial_flags =
device_flags =
  -DFREEINK_DEVICE_SILKSCREEN=1
  -DSILKSCREEN_PANEL_368=1
  -DFREEINK_CAP_TOUCH=0
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DUSB_PRODUCT=\"Silkscreen_Reader\"
  -DUSB_MANUFACTURER=\"Silkscreen\"
  ${silkscreen368.frontlight_flags}
  ${silkscreen368.display_flags}

[env:silkscreen-368]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  ${silkscreen368.device_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-silkscreen-368\"
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2

[env:silkscreen-368-gh_release]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  ${silkscreen368.device_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

