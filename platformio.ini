; --- Silkscreen — ESP32-S3-WROOM-1-N16R8 (16MB flash, 8MB octal PSRAM), 4.26" panel ---
; Open-hardware reader base board (successor of de-link). The SDK profile carries
; the pin map; the panel controller (SSD1677 or UC8279D), touch, RTC and key
; ladders are probed at boot, and the front light when switched on. Another panel
; family gets its own env. See docs/silkscreen/PORTING.md and MODULARITY.md.
; Same USB-MSC recipe as the X4 Pro: extends base (not firmware_tuned) for the
; prebuilt dio_opi core's TinyUSB, and the base 16MB partitions.csv with two OTA
; slots. SD is native 4-bit SDMMC.
;   pio run -e silkscreen -t upload
[silkscreen]
; Front light: compiled in by default, for a lit panel (GDEQ0426T82-FL01C / -FT01C)
; on J3 or an external LED string on J6 (HARDWARE.md 7, 13.1). The SDK drives the
; TPS923610 enable sequence, warm/cool on COLOR_SEL (blended on a 10 kHz carrier;
; -DSILKSCREEN_FRONTLIGHT_BLEND_HZ=0 here keeps a fixed choice), and a 23 V
; LED_MONIT over-voltage trip (SILKSCREEN_FRONTLIGHT_TRIP_MV). The boost runs only
; when the user switches the light on (or Restore Light on Wake does), and each
; switch-on probes LED_MONIT for a load: a board with no light says "No front light
; detected" and stays dark, and a single-colour light keeps to its one string. Its
; unloaded enable is safe (U10 latches off at its OVP) but avoidable: a board that
; will never have a light can still drop it in platformio.local.ini (gitignored):
;   [silkscreen]
;   frontlight_flags =
; IO42 (ADIM) and IO40 (COLOR_SEL) then stay parked LOW at boot and through sleep.
frontlight_flags =
  -DFREEINK_CAP_FRONTLIGHT=1
  -DFREEINK_CAP_WARMLIGHT=1
; Panel controller: probed at every cold boot (SSD1677 on a Good Display
; GDEQ0426T82, UC8279D on the custom panel) and kept across deep sleep in RTC
; memory. Deep sleep keeps 3V3 live, so swap a panel with the cell and USB
; disconnected. A unit whose probe misbehaves forces it in platformio.local.ini,
; which skips the probe:
;   [silkscreen]
;   display_flags = -DSILKSCREEN_DISPLAY_CONTROLLER=uc8279   ; or ssd1677
display_flags =
; Touch: the FT6336U tail on J4's default jumpers is probed at every cold boot,
; and 0x38 counts as touch only with a FocalTech chip id. A GT911 tail on the
; alternate jumpers (R43/R66, HARDWARE.md 8) needs its fallback, whose probe drives
; TP_INT (IO41). Without it the FT probe's reset restarts the GT911 awake at 0x14
; and nothing ever puts it to sleep: about 3.3 mA in every deep sleep (P2 reports
; touch_not_probed). A build for such a board adds it in platformio.local.ini:
;   [silkscreen]
;   touch_flags = -DSILKSCREEN_TOUCH_ALT_JUMPERS=1
touch_flags =
device_flags =
  -DFREEINK_DEVICE_SILKSCREEN=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DUSB_PRODUCT=\"Silkscreen_Reader\"
  -DUSB_MANUFACTURER=\"Silkscreen\"
  ${silkscreen.frontlight_flags}
  ${silkscreen.display_flags}
  ${silkscreen.touch_flags}

[env:silkscreen]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  ${silkscreen.device_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-silkscreen\"
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2

[env:silkscreen-gh_release]
extends = base
board = esp32-s3-devkitc1-n16r8
