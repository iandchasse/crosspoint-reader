; --- EEGO Reader A4 — ESP32-S3 N16R8, UC8279C 768x552 + GSLX680 touch ---------
; UC8279C SPI panel, GSLX680 touch, PCF8563 RTC, dedicated HSPI MicroSD (SPI,
; not SDMMC). 16MB DIO flash + 8MB OPI PSRAM. One binary serves the frontlit
; and lightless variants: FrontlightManager probes the I2C LED driver (0x36)
; at begin() and the firmware hides the light UI when it does not ACK.
; Native USB Serial/JTAG normally; USB Drive exports the SPI SD card through
; the SDK's block-device handoff using the prebuilt dio_opi TinyUSB core.
; BleKeyboardHost links stubs (no NimBLE): src/BleInput still compiles.
